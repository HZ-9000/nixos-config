  <rect width="160" height="160" rx="36" fill="#081512"/>
  <rect x="6" y="6" width="148" height="148" rx="30" fill="none" stroke="#1b6352" stroke-width="2"/>
  <!-- jade disc (bi) -->
  <circle cx="80" cy="80" r="50" fill="#166050"/>
